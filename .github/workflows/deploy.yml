name: Deploy Node.js App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Node.js Server
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      APP_PATH: ${{ secrets.APP_PATH }}

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Install pnpm
      - name: Install pnpm
        run: |
          npm install -g pnpm

      # Install dependencies
      - name: Install dependencies with pnpm
        run: pnpm install

      # Deploy to EC2
      - name: Deploy to EC2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Create .ssh directory if it doesn't exist
          mkdir -p ~/.ssh

          # Add EC2 host to known_hosts
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

          # Set up private key
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          # Connect to EC2 and deploy
          ssh -i private_key.pem $EC2_USER@$EC2_HOST << 'EOF'
          # Install git and pm2 if not already installed using yum
          if ! command -v git &> /dev/null; then
            sudo yum update -y && sudo yum install -y git
          fi
          if ! command -v pm2 &> /dev/null; then
            sudo npm install -g pm2
          fi

          # Navigate to the application path
          mkdir -p $APP_PATH
          cd $APP_PATH

          # Initialize git repository if not already done
          if [ ! -d ".git" ]; then
            git init
            git remote add origin git@github.com:<your-repo-owner>/<your-repo-name>.git
          fi

          # Pull the latest changes
          git pull origin main

          # Install dependencies with pnpm
          pnpm install --prod

          # Restart the server with pm2
          pm2 stop all || true
          pm2 start index.js --name "node-server"
          EOF

          # Cleanup
          rm -f private_key.pem
